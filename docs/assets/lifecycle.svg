<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366f1"/>
    </marker>
  </defs>
  <text x="480" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">您的数据在 DAINS 里的一生</text>
  <rect x="54" y="56" width="148" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="128" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">上传数据</text>
  <text x="128" y="102" text-anchor="middle" font-size="10.5" fill="#64748b">数据管理 · 仅您可见</text>
  <rect x="230" y="56" width="148" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="304" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">解析与统计</text>
  <text x="304" y="102" text-anchor="middle" font-size="10.5" fill="#64748b">宽表 · 字段画像</text>
  <rect x="406" y="56" width="148" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="480" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">分析与建模</text>
  <text x="480" y="102" text-anchor="middle" font-size="10.5" fill="#64748b">分析 · 工具 · 代码实证</text>
  <rect x="582" y="56" width="148" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="656" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">报告与导出</text>
  <text x="656" y="102" text-anchor="middle" font-size="10.5" fill="#64748b">四位一体 · HTML / PDF</text>
  <rect x="758" y="56" width="148" height="64" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="832" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">删除与注销</text>
  <text x="832" y="102" text-anchor="middle" font-size="10.5" fill="#b91c1c">数据全清 · 不留副本</text>
  <line x1="202" y1="88" x2="226" y2="88" stroke="#6366f1" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="378" y1="88" x2="402" y2="88" stroke="#6366f1" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="554" y1="88" x2="578" y2="88" stroke="#6366f1" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="730" y1="88" x2="754" y2="88" stroke="#6366f1" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="54" y="180" width="272" height="96" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="190" y="206" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">《个人信息保护法》合规</text>
  <text x="190" y="228" text-anchor="middle" font-size="10.5" fill="#78350f">只处理您主动上传的数据</text>
  <text x="190" y="248" text-anchor="middle" font-size="10.5" fill="#78350f">最小必要 · 不做二次分发</text>
  <rect x="344" y="180" width="272" height="96" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
  <text x="480" y="206" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">用户数据隔离</text>
  <text x="480" y="228" text-anchor="middle" font-size="10.5" fill="#14532d">会话隔离 · 数据库按用户分域</text>
  <text x="480" y="248" text-anchor="middle" font-size="10.5" fill="#14532d">DAINS 无必要留存用户数据副本</text>
  <rect x="634" y="180" width="272" height="96" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="770" y="206" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e40af">注销即全清</text>
  <text x="770" y="228" text-anchor="middle" font-size="10.5" fill="#1e3a8a">注销账号时同步删除</text>
  <text x="770" y="248" text-anchor="middle" font-size="10.5" fill="#1e3a8a">数据文件 · 分析产物 · 会话记录</text>
  <rect x="54" y="308" width="852" height="52" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="480" y="330" text-anchor="middle" font-size="11.5" fill="#475569">数据生命周期全程可见：每一步产物（宽表 · 报告 · 图表）都归您所有，可在文档区随时查阅</text>
  <text x="480" y="350" text-anchor="middle" font-size="11.5" fill="#475569">DAINS 立志于做一个「可信 · 知识可复用」的产品，而不是数据的仓库</text>
</svg>
